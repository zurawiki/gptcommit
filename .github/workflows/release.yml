name: Release

on:
    workflow_call:
        inputs:
            publish-tag:
                required: true
                type: string
        secrets:
            CARGO_REGISTRY_TOKEN:
                required: true
            HOMEBREW_RELEASE_GH_TOKEN:
                required: false

env:
    RUST_BACKTRACE: 1
    CARGO_TERM_COLOR: always

jobs:
    create-release:
        name: Create release
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/main'
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: true

            - name: Install rust
              uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
              with:
                  toolchain: stable
                  cache: false
                  build-warnings: warn

            - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

            - name: Publish
              run: cargo publish
              env:
                  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

            - name: Tag the version
              run: |
                  git tag "${{ inputs.publish-tag }}"
                  git push origin "${{ inputs.publish-tag }}"
            - uses: taiki-e/create-gh-release-action@eba8ea96c86cca8a37f1b56e94b4d13301fba651 # v1.11.0
              name: Create github release
              with:
                  branch: main
                  changelog: CHANGELOG.md
                  ref: refs/tags/${{ inputs.publish-tag }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    trigger-homebrew:
        name: Trigger package manager updates
        needs:
            - create-release
            - upload-binary
        runs-on: ubuntu-latest
        steps:
          - name: Trigger homebrew release
            run: gh workflow run bump.yml --repo zurawiki/homebrew-brews || true
            env:
                GH_TOKEN: ${{ secrets.HOMEBREW_RELEASE_GH_TOKEN }}
          - name: Trigger Winget Build
            uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
            env:
              PUBLISH_TAG: ${{ inputs.publish-tag }}
            with:
              github-token: ${{ secrets.GITHUB_TOKEN }}
              script: |
                  await github.request('POST /repos/{owner}/{repo}/actions/workflows/{workflow_id}/dispatches', {
                      owner: 'zurawiki',
                      repo: '${{ github.event.repository.name }}',
                      workflow_id: 'winget.yml',
                      ref: 'main',
                      inputs: {"version": process.env.PUBLISH_TAG.replace(/^v/, '')}
                  })

    upload-binary:
        name: ${{ matrix.target }}
        needs:
            - create-release
        strategy:
            fail-fast: false
            matrix:
                include:
                    - target: x86_64-unknown-linux-gnu
                    - os: macos-latest
                      target: aarch64-apple-darwin
                    - os: macos-latest
                      target: x86_64-apple-darwin
                    - os: windows-latest
                      target: x86_64-pc-windows-msvc
        runs-on: ${{ matrix.os || 'ubuntu-latest' }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Install rust
              uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
              with:
                  toolchain: stable
                  cache: false
                  build-warnings: warn

            - name: Upload binary
              uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
              with:
                  bin: gptcommit
                  target: ${{ matrix.target }}
                  ref: refs/tags/${{ inputs.publish-tag }}
                  tar: all
                  zip: windows
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
                  CARGO_PROFILE_RELEASE_LTO: true
